<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Weather - Your Daily Energy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="p-4 md:p-8">

    <div class="w-full max-w-6xl h-full flex flex-col overflow-hidden">
        <!-- Header: Fixed at top -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-6 gap-6 w-full flex-shrink-0">
            <div class="flex items-center gap-3 group cursor-default">
                <div
                    class="w-12 h-12 bg-black rounded-2xl flex items-center justify-center shadow-lg transition-transform group-hover:rotate-12">
                    <i class="fas fa-bolt-lightning text-white text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-black tracking-tighter leading-none">VIBE</h1>
                    <p class="text-[10px] font-bold tracking-[0.3em] text-black/40 uppercase">Weather</p>
                </div>
            </div>

            <div
                class="search-container flex items-center p-1.5 w-full max-w-md focus-within:ring-2 focus-within:ring-black/5">
                <div class="pl-4 text-black/20">
                    <i class="fas fa-map-marker-alt"></i>
                </div>
                <input type="text" id="cityInput" placeholder="Enter a city name..." autocomplete="off"
                    class="bg-transparent border-none focus:ring-0 w-full p-2.5 outline-none text-black search-input font-medium">
                <button id="searchBtn" class="icon-button w-12 h-12 ml-2" title="Check Vibe">
                    <i class="fas fa-search"></i>
                </button>
            </div>
        </header>

        <!-- Main Content Area: Fills remaining height -->
        <div id="contentWrapper" class="flex-grow min-h-0 relative">

            <!-- Welcome View -->
            <div id="infoBox"
                class="glass-card h-full w-full flex flex-col items-center justify-center text-center p-10">
                <div class="w-24 h-24 bg-black/5 rounded-full flex items-center justify-center mb-6">
                    <i class="fas fa-cloud-sun text-4xl text-black/20"></i>
                </div>
                <h2 class="text-2xl font-bold mb-2 uppercase tracking-widest text-black/80">Vibe Check</h2>
                <p class="text-black/30 max-w-xs">Enter your city above to see the local energy and weather atmosphere.
                </p>
            </div>

            <!-- Dashboard -->
            <main id="weatherDisplay" class="hidden h-full flex flex-col gap-5 overflow-hidden">

                <!-- Top Row: Weather + AQI -->
                <div class="flex-grow grid grid-cols-1 lg:grid-cols-12 gap-5 min-h-0">
                    <!-- Main Weather (Left) -->
                    <section class="lg:col-span-8 glass-card p-8 relative overflow-hidden">
                        <div class="flex-grow">
                            <div class="flex items-center gap-2 text-black/30 mb-1">
                                <i class="fas fa-location-arrow text-[10px]"></i>
                                <span id="cityName" class="font-bold uppercase tracking-widest text-xs">--</span>
                            </div>
                            <h2 id="currentDate" class="text-3xl font-bold mb-4 text-black/90 tracking-tight">--</h2>

                            <div class="flex items-start">
                                <span id="temp"
                                    class="text-[80px] lg:text-[100px] font-black leading-none tracking-tighter text-black">--</span>
                                <span class="text-3xl font-bold mt-4 text-black/30">°C</span>
                            </div>
                            <p id="weatherDesc"
                                class="text-xl font-light uppercase tracking-[0.3em] text-black/40 mt-2">--</p>
                        </div>

                        <div class="absolute right-8 top-8 opacity-5">
                            <div id="weatherIconLarge" class="text-[140px] lg:text-[180px] float-icon text-black">
                                <i class="fas fa-sun"></i>
                            </div>
                        </div>

                        <!-- Metrics -->
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 pt-6 border-t border-black/5 mt-auto">
                            <div>
                                <p class="text-[9px] uppercase tracking-widest text-black/30 mb-1 font-bold">Humidity
                                </p>
                                <p id="humidity" class="text-base font-bold text-black/80">--%</p>
                            </div>
                            <div>
                                <p class="text-[9px] uppercase tracking-widest text-black/30 mb-1 font-bold">Wind</p>
                                <p id="windSpeed" class="text-base font-bold text-black/80">-- km/h</p>
                            </div>
                            <div>
                                <p class="text-[9px] uppercase tracking-widest text-black/30 mb-1 font-bold">Feels Like
                                </p>
                                <p id="feelsLike" class="text-base font-bold text-black/80">--°</p>
                            </div>
                            <div>
                                <p class="text-[9px] uppercase tracking-widest text-black/30 mb-1 font-bold">Pressure
                                </p>
                                <p id="pressure" class="text-base font-bold text-black/80">-- hPa</p>
                            </div>
                        </div>
                    </section>

                    <!-- AQI (Right) -->
                    <section
                        class="lg:col-span-4 glass-card p-6 flex flex-col items-center justify-between overflow-hidden">
                        <h3 class="text-xs font-bold uppercase tracking-widest self-start text-black/30">Air Atmosphere
                        </h3>

                        <div class="flex flex-col items-center justify-center py-4">
                            <div id="aqiBadge"
                                class="mb-3 bg-black text-white px-4 py-1 rounded-full text-[10px] font-bold uppercase tracking-widest">
                                --
                            </div>
                            <div id="aqiValue" class="text-7xl font-black text-black/90 tracking-tighter">--</div>
                            <p id="aqiStatus"
                                class="text-center text-[11px] text-black/40 leading-tight mt-2 max-w-[150px] font-medium">
                                ---</p>
                        </div>

                        <div class="w-full space-y-2">
                            <div class="flex justify-between p-3 rounded-xl bg-black/[0.03] border border-black/5">
                                <span class="text-[9px] font-bold uppercase text-black/30">Fine PM2.5</span>
                                <span id="pm25" class="text-xs font-black text-black/70">--</span>
                            </div>
                            <div class="flex justify-between p-3 rounded-xl bg-black/[0.03] border border-black/5">
                                <span class="text-[9px] font-bold uppercase text-black/30">Dust PM10</span>
                                <span id="pm10" class="text-xs font-black text-black/70">--</span>
                            </div>
                        </div>
                    </section>
                </div>

                <!-- Bottom Row: Forecast Grid -->
                <section class="glass-card p-4 flex-shrink-0">
                    <div id="forecastContainer" class="grid grid-cols-5 gap-3">
                        <!-- Injected by JS -->
                    </div>
                </section>

            </main>
        </div>
    </div>


</body>

</html>
<script src="script.js"></script>
